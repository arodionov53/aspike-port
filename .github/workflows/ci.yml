name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      aerospike:
        image: aerospike:ce-7.1.0.0
        ports:
          - 3000:3000
          - 3001:3001
          - 3002:3002
          - 3003:3003
        options: --ulimit nofile=65536:65536 --health-cmd "asadm -e info" --health-interval 3s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'

      - name: Install C dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libev-dev libyaml-dev libssl-dev zlib1g-dev

      - name: Build
        run: make

      - name: Run tests
        run: ./rebar3 eunit --module=aspike_nif_eunit_test --verbose
